name: Secret Guard

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: secret-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security / tracked-secret-guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for high-confidence secrets
        shell: bash
        run: |
          python <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          allowed_env_files = {'.env.template', '.env.example', '.env.sample'}
          binary_suffixes = {
              '.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.pdf', '.zip',
              '.gz', '.tar', '.woff', '.woff2', '.ttf', '.otf', '.mp4', '.mov'
          }

          patterns = {
              'OpenAI-style secret': re.compile(r'\bsk-[A-Za-z0-9_-]{20,}\b'),
              'GitHub token': re.compile(r'\bgh[pousr]_[A-Za-z0-9]{30,}\b'),
              'AWS access key': re.compile(r'\bAKIA[0-9A-Z]{16}\b'),
              'Private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'Supabase service role assignment': re.compile(
                  r'SUPABASE_SERVICE_ROLE_KEY\s*[=:]\s*["\']?(?!ci-placeholder)[A-Za-z0-9._-]{20,}'
              ),
          }

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          violations = []

          for relative in filter(None, tracked):
              path = pathlib.Path(relative)

              if path.name.startswith('.env') and path.name not in allowed_env_files:
                  violations.append((relative, 0, 'tracked .env file'))
                  continue

              if path.suffix.lower() in binary_suffixes:
                  continue

              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              for line_number, line in enumerate(text.splitlines(), start=1):
                  for label, pattern in patterns.items():
                      if pattern.search(line):
                          violations.append((relative, line_number, label))

          if violations:
              print('Potential secrets detected in tracked files:', file=sys.stderr)
              for path, line, label in violations:
                  location = f'{path}:{line}' if line else path
                  print(f'  - {location}: {label}', file=sys.stderr)
              sys.exit(1)

          print('No high-confidence tracked secrets detected.')
          PY
