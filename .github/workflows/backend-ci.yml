name: Backend CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend / build-lint-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint changed backend TypeScript files
        if: github.event_name == 'pull_request'
        working-directory: .
        shell: bash
        run: |
          mapfile -t changed_files < <(
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- src/backend \
              | grep -E '^src/backend/(src|test)/.*\.ts$' || true
          )

          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed backend TypeScript files to lint."
            exit 0
          fi

          relative_files=()
          for file in "${changed_files[@]}"; do
            relative_files+=("${file#src/backend/}")
          done

          echo "Linting changed backend TypeScript files:"
          printf '  - %s\n' "${relative_files[@]}"

          cd src/backend
          npx eslint "${relative_files[@]}"

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  e2e:
    name: Backend / e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: familyroots_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d familyroots_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/familyroots_test?schema=public
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma schema to ephemeral database
        run: npx prisma db push --skip-generate

      - name: E2E tests
        run: npm run test:e2e -- --runInBand
